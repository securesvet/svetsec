name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_PLATFORM: linux/amd64

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and verify production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          tags: svetsec:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/svetsec-image.tar
          cache-from: type=gha,scope=production-image,timeout=20m
          cache-to: type=gha,mode=max,scope=production-image,timeout=20m,ignore-error=true
          provenance: false
      - uses: actions/upload-artifact@v7
        with:
          name: svetsec-image
          path: ${{ runner.temp }}/svetsec-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://svetsec.ru
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/svetsec' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: svetsec-image
          path: ${{ runner.temp }}
      - name: Validate deployment settings
        shell: bash
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Upload release
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "$DEPLOY_PORT" \
            "${{ runner.temp }}/svetsec-image.tar" \
            Caddyfile compose.production.yml scripts/deploy-release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
      - name: Activate release
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/deploy-release.sh '$DEPLOY_PATH' '${{ github.sha }}'"
