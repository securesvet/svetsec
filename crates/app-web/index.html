<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="svetsec.ru — a personal site about security, Rust, and systems."
    />
    <meta name="theme-color" content="#ffffff" />
    <link data-trunk rel="rust" data-no-minify />
    <title>svetsec.ru</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      pre {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font: clamp(12px, 1.25vw, 18px) / 1.15 "SFMono-Regular", Consolas,
          "Liberation Mono", monospace;
        outline: none;
        color: #181a1c;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      @media (max-width: 480px) {
        pre {
          font-size: clamp(10px, 3vw, 13px);
          line-height: 1.1;
        }
      }

      .semantic-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="semantic-fallback">
      <h1>svetsec.ru</h1>
      <nav aria-label="Primary">
        <a href="#main">Main</a>
        <a href="#articles">Articles</a>
        <a href="#info">Info</a>
      </nav>
      <p>A personal site about security, Rust, and systems.</p>
    </main>
    <noscript>This site needs WebAssembly and JavaScript to display its interactive TUI.</noscript>
  </body>
</html>
