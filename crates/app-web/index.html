<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="svetsec.ru — a personal site about security, Rust, and systems."
    />
    <meta name="theme-color" content="#f8f9fb" />
    <link data-trunk rel="rust" data-no-minify />
    <link
      data-trunk
      rel="copy-file"
      href="assets/profile.jpg"
      data-target-path="assets"
    />
    <link
      data-trunk
      rel="copy-file"
      href="assets/resume.pdf"
      data-target-path="assets"
    />
    <title>svetsec.ru</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #f8f9fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f8f9fb;
        overscroll-behavior: none;
      }

      body {
        position: fixed;
        inset: 0;
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
      }

      #terminal {
        --terminal-cell-width: 10px;
        --terminal-cell-height: 20px;
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #f8f9fb;
      }

      #terminal_ratzilla_grid {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8f9fb;
      }

      #terminal[data-native-scroll="true"] {
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        scrollbar-color: #94989a #f5f6f4;
        scrollbar-width: thin;
        touch-action: pan-y;
      }

      #terminal[data-native-scroll="true"] #terminal_ratzilla_grid {
        position: relative;
        top: var(--article-scroll-offset, 0px);
        left: 0;
      }

      #web-article-scroll-spacer {
        width: 1px;
        min-height: 0;
        pointer-events: none;
        user-select: none;
      }

      #article-media-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
      }

      .native-article-image {
        position: fixed;
        object-fit: contain;
        object-position: left top;
        background: #fff;
        image-rendering: auto;
      }

      #terminal_ratzilla_grid > pre > span.web-native-image-cell {
        color: transparent !important;
        background: #fff !important;
        user-select: none !important;
        -webkit-user-select: none !important;
      }

      #terminal > pre,
      #terminal_ratzilla_grid > pre {
        /* The first selector covers RatZilla's temporary cell-size probe. */
        height: var(--terminal-cell-height) !important;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: min(16.6667px, calc(var(--terminal-cell-height) * 0.82));
        line-height: var(--terminal-cell-height) !important;
      }

      #terminal_ratzilla_grid > pre {
        width: 100%;
        margin: 0;
        overflow: hidden;
        outline: none;
        color: #181a1c;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* RatZilla calculates the Rust buffer using 10×20 px cells. Keep its
         measured DOM cells aligned with that buffer, including at browser
         zoom levels where 1ch is no longer close to 10 CSS pixels. */
      #terminal > pre > span[style*="width: 1ch"],
      #terminal_ratzilla_grid > pre > span[style*="width: 1ch"] {
        width: var(--terminal-cell-width) !important;
      }

      #terminal > pre > span[style*="width: 2ch"],
      #terminal_ratzilla_grid > pre > span[style*="width: 2ch"] {
        width: calc(var(--terminal-cell-width) * 2) !important;
      }

      #terminal > pre > span[style*="width: 0ch"],
      #terminal_ratzilla_grid > pre > span[style*="width: 0ch"] {
        width: 0 !important;
      }

      #terminal_ratzilla_grid > pre > span {
        user-select: none;
        -webkit-user-select: none;
      }

      #terminal_ratzilla_grid > pre > span.web-selectable-text {
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
      }

      #terminal_ratzilla_grid > pre > span.web-selection-muted {
        user-select: none !important;
        -webkit-user-select: none !important;
      }

      #terminal_ratzilla_grid > pre span::selection {
        color: #fff;
        background: #315d82;
      }

      .web-tab-cell {
        background: #f5f6f4 !important;
        color: #696d70 !important;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          filter 140ms ease;
      }

      .web-tab-hovered {
        background: #e8e9e7 !important;
        color: #181a1c !important;
        filter: brightness(1.08);
      }

      .web-tab-selected {
        background: #315d82 !important;
        color: #fff !important;
        font-weight: 700;
      }

      .web-tab-selected.web-tab-hovered {
        background: #3c709b !important;
      }

      .web-tab-start {
        border-radius: 999px 0 0 999px;
      }

      .web-tab-end {
        border-radius: 0 999px 999px 0;
      }

      .web-code-action {
        color: #fff !important;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        font-weight: 700;
        transition:
          background-color 120ms ease,
          filter 120ms ease;
      }

      .web-code-run {
        background: #315d82 !important;
      }

      .web-code-copy {
        background: #46515c !important;
      }

      .web-code-run:hover,
      .web-code-copy:hover {
        background: #3c709b !important;
        filter: brightness(1.08);
      }

      .web-code-start {
        border-radius: 999px 0 0 999px;
      }

      .web-code-end {
        border-radius: 0 999px 999px 0;
      }

      .web-clickable {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          filter 120ms ease;
      }

      .web-article-link:hover {
        background: #e8e9e7 !important;
        color: #181a1c !important;
        filter: brightness(1.08);
      }

      .web-project-card:hover {
        background: #f0f2f4 !important;
        color: #181a1c !important;
        filter: brightness(1.08);
      }

      .web-output-close:hover {
        background: #3c709b !important;
        color: #fff !important;
      }

      .web-comment-action {
        color: #fff !important;
        background: #4c7598 !important;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        font-weight: 700;
      }

      .web-comment-action:hover {
        background: #315d82 !important;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgb(24 26 28 / 28%);
      }

      .modal-overlay[hidden] {
        display: none;
      }

      .modal-card {
        width: min(420px, 100%);
        border: 1px solid #94989a;
        border-radius: 18px;
        padding: 22px;
        color: #181a1c;
        background: #fff;
        box-shadow: 0 18px 60px rgb(24 26 28 / 22%);
      }

      .modal-card h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .modal-card label {
        display: grid;
        gap: 6px;
        margin-block: 12px;
        color: #464a4e;
        font-size: 13px;
        font-weight: 700;
      }

      .modal-card input,
      .modal-card textarea {
        width: 100%;
        border: 1px solid #94989a;
        border-radius: 10px;
        padding: 11px 12px;
        color: #181a1c;
        background: #f8f9fb;
        font: 14px/1.45 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      .modal-card textarea {
        min-height: 130px;
        resize: vertical;
      }

      .modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .modal-actions button {
        min-height: 42px;
        border: 1px solid #94989a;
        border-radius: 999px;
        padding: 0 16px;
        color: #181a1c;
        background: #f5f6f4;
        font: 700 13px/1 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        cursor: pointer;
      }

      .modal-actions button[type="submit"] {
        border-color: #315d82;
        color: #fff;
        background: #315d82;
      }

      .modal-actions button:hover {
        filter: brightness(0.94);
      }

      .reader-login {
        min-height: 42px;
        margin-top: 14px;
        border: 1px solid #315d82;
        border-radius: 999px;
        padding: 0 16px;
        color: #fff;
        background: #315d82;
        font: 700 13px/1 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        cursor: pointer;
      }

      .modal-error {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: #a33b31;
        font-size: 12px;
      }

      .comment-list {
        display: grid;
        gap: 10px;
        max-height: min(34vh, 260px);
        overflow-y: auto;
        padding-right: 4px;
      }

      .comment-entry {
        border-left: 3px solid #d7dadd;
        padding-left: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .comment-entry strong {
        display: block;
        margin-bottom: 3px;
        color: #315d82;
      }

      #comment-modal[data-signed-in="false"] .signed-in-only {
        display: none;
      }

      #comment-modal[data-signed-in="true"] .reader-login {
        display: none;
      }

      #auth-modal[data-mode="owner"] .reader-only {
        display: none;
      }

      .web-back-link,
      .web-resume-link {
        color: #1c649f !important;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .web-back-link:hover,
      .web-resume-link:hover {
        color: #0d416b !important;
        background: #e8e9e7 !important;
      }

      #mobile-controls {
        display: none;
      }

      @media (max-width: 700px), (pointer: coarse) {
        #terminal {
          bottom: calc(64px + env(safe-area-inset-bottom, 0px));
          touch-action: none;
        }

        body[data-mobile-article-open="true"] #terminal {
          bottom: calc(120px + env(safe-area-inset-bottom, 0px));
        }

        #mobile-controls {
          position: fixed;
          z-index: 30;
          right: max(8px, env(safe-area-inset-right));
          bottom: max(8px, env(safe-area-inset-bottom));
          left: max(8px, env(safe-area-inset-left));
          display: grid;
          gap: 8px;
          pointer-events: auto;
        }

        .mobile-article-actions,
        .mobile-tab-actions {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 8px;
        }

        .mobile-article-actions {
          display: none;
        }

        body[data-mobile-article-open="true"] .mobile-article-actions {
          display: grid;
        }

        #mobile-controls button,
        #mobile-controls a {
          min-width: 0;
          min-height: 48px;
          border: 1px solid #94989a;
          border-radius: 14px;
          color: #181a1c;
          background: rgb(255 255 255 / 96%);
          font: 700 13px/1 "SFMono-Regular", Consolas, "Liberation Mono",
            monospace;
          box-shadow: 0 8px 26px rgb(24 26 28 / 16%);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 8px;
          text-align: center;
          text-decoration: none;
          white-space: nowrap;
          overflow: hidden;
          cursor: pointer;
          touch-action: manipulation;
          user-select: none;
          -webkit-user-select: none;
        }

        #mobile-controls a[aria-current="page"] {
          border-color: #6da8d3;
          color: #fff;
          background: #315d82;
        }

        .mobile-tab-actions a {
          padding-inline: 4px;
          font-size: clamp(10px, 2.8vw, 13px);
        }

        #mobile-controls button:active,
        #mobile-controls a:active {
          background: #315d82;
          color: #fff;
          transform: translateY(1px);
        }
      }

      .semantic-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body data-mobile-article-open="false">
    <div id="terminal"></div>
    <div id="article-media-layer" aria-live="polite"></div>
    <div id="mobile-controls">
      <div class="mobile-article-actions" aria-label="Article controls">
        <button type="button" data-article-action="back">← Articles</button>
        <button type="button" data-article-action="up" aria-label="Scroll article up">K ↑</button>
        <button type="button" data-article-action="down" aria-label="Scroll article down">J ↓</button>
        <button type="button" data-article-action="comment">Comment</button>
      </div>
      <nav class="mobile-tab-actions" aria-label="Primary mobile navigation">
        <a href="/" data-mobile-tab="main">Main</a>
        <a href="/articles" data-mobile-tab="articles">Articles</a>
        <a href="/projects" data-mobile-tab="projects">Projects</a>
        <a href="/info" data-mobile-tab="info">Info</a>
      </nav>
    </div>
    <div id="auth-modal" class="modal-overlay" data-mode="reader" hidden>
      <form id="auth-form" class="modal-card" data-action="login">
        <h2 id="auth-title">Reader account</h2>
        <label id="auth-username-row" class="reader-only">
          <span id="auth-username-label">Username</span>
          <input
            id="auth-username"
            name="username"
            autocomplete="username"
            minlength="3"
            maxlength="24"
          />
        </label>
        <label>
          <span id="auth-password-label">Password</span>
          <input
            id="auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            maxlength="128"
            required
          />
        </label>
        <div class="modal-actions">
          <button id="auth-login" type="submit" data-auth-action="login">Sign in</button>
          <button id="auth-register" type="submit" class="reader-only" data-auth-action="register">Register</button>
          <button id="auth-cancel" type="button" data-modal-close="auth-modal">Cancel</button>
        </div>
        <p id="auth-error" class="modal-error" role="alert"></p>
      </form>
    </div>
    <div id="comment-modal" class="modal-overlay" hidden>
      <form id="comment-form" class="modal-card">
        <h2 id="comment-title">Comments</h2>
        <div id="comment-list" class="comment-list"></div>
        <button id="comment-sign-in" class="reader-login" type="button">Sign in / register</button>
        <label class="signed-in-only">
          <span id="comment-message-label">Message</span>
          <textarea id="comment-body" maxlength="1000" required></textarea>
        </label>
        <div class="modal-actions">
          <button id="comment-publish" class="signed-in-only" type="submit">Publish</button>
          <button id="comment-cancel" type="button" data-modal-close="comment-modal">Cancel</button>
        </div>
        <p id="comment-error" class="modal-error" role="alert"></p>
      </form>
    </div>
    <main class="semantic-fallback">
      <h1>svetsec.ru</h1>
      <nav aria-label="Primary">
        <a href="/">Main</a>
        <a href="/articles">Articles</a>
        <a href="/projects">Projects</a>
        <a href="/info">Info</a>
        <a href="/resume">Resume</a>
      </nav>
      <p>A personal site about security, Rust, and systems.</p>
    </main>
    <noscript>This site needs WebAssembly and JavaScript to display its interactive TUI.</noscript>
    <script>
      (() => {
        const terminal = document.getElementById("terminal");
        if (!terminal) return;

        const usesScreenSize = /mobile|tablet/i.test(navigator.userAgent);
        let lastWidth = -1;
        let lastHeight = -1;

        const bufferDimensions = () => {
          const sourceWidth = usesScreenSize
            ? window.screen.width
            : window.innerWidth;
          const sourceHeight = usesScreenSize
            ? window.screen.height
            : window.innerHeight;
          return {
            columns: Math.max(1, Math.floor(sourceWidth / 10) - 1),
            rows: Math.max(
              1,
              Math.floor(sourceHeight / (usesScreenSize ? 19 : 20)) - 1,
            ),
          };
        };

        const syncTerminalMetrics = (notifyRenderer = false) => {
          const width = terminal.clientWidth;
          const height = terminal.clientHeight;
          if (
            Math.abs(width - lastWidth) < 0.5 &&
            Math.abs(height - lastHeight) < 0.5
          ) {
            return;
          }

          lastWidth = width;
          lastHeight = height;
          const { columns, rows } = bufferDimensions();
          terminal.style.setProperty(
            "--terminal-cell-width",
            `${Math.max(1, width - 0.5) / columns}px`,
          );
          terminal.style.setProperty(
            "--terminal-cell-height",
            `${Math.max(1, height - 0.5) / rows}px`,
          );

          // RatZilla already observes real window resizes. Only synthesize an
          // event for size changes caused by our mobile controls or safe area.
          if (notifyRenderer) window.dispatchEvent(new Event("resize"));
        };

        // Set exact metrics before the WASM module creates its first grid.
        syncTerminalMetrics();

        // This listener is installed before RatZilla's, so new metrics are in
        // place before its resize handler rebuilds the grid.
        window.addEventListener("resize", () => syncTerminalMetrics(), {
          passive: true,
        });

        if ("ResizeObserver" in window) {
          window.__svetsecResizeObserver = new ResizeObserver(() =>
            syncTerminalMetrics(true),
          );
          window.__svetsecResizeObserver.observe(terminal);
        }

        window.visualViewport?.addEventListener("resize", () =>
          syncTerminalMetrics(true),
        );
        document.addEventListener("fullscreenchange", () =>
          syncTerminalMetrics(true),
        );
      })();
    </script>
  </body>
</html>
