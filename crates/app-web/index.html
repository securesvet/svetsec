<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="svetsec.ru — a personal site about security, Rust, and systems."
    />
    <meta name="theme-color" content="#070a0e" />
    <link data-trunk rel="rust" data-no-minify />
    <link
      data-trunk
      rel="copy-file"
      href="assets/profile.jpg"
      data-target-path="assets"
    />
    <link
      data-trunk
      rel="copy-file"
      href="assets/resume.pdf"
      data-target-path="assets"
    />
    <title>svetsec.ru</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #070a0e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        min-width: 320px;
        height: 100vh;
        height: 100dvh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background: #070a0e;
        overscroll-behavior: none;
      }

      #terminal {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #070a0e;
      }

      #terminal_ratzilla_grid {
        min-width: 100%;
        min-height: 100%;
        background: #070a0e;
      }

      #article-media-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
      }

      .native-article-image {
        position: fixed;
        object-fit: contain;
        object-position: left top;
        background: #0d131b;
        image-rendering: auto;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #terminal > pre,
      #terminal_ratzilla_grid > pre {
        /* The first selector covers RatZilla's temporary cell-size probe. */
        font: clamp(12px, 1vw, 16px) / 1.15 "SFMono-Regular", Consolas,
          "Liberation Mono", monospace;
      }

      #terminal_ratzilla_grid > pre {
        width: 100%;
        margin: 0;
        overflow: hidden;
        outline: none;
        color: #e6edf3;
        touch-action: manipulation;
        user-select: text;
        -webkit-user-select: text;
        -webkit-tap-highlight-color: transparent;
      }

      #terminal_ratzilla_grid > pre::selection,
      #terminal_ratzilla_grid > pre span::selection {
        color: #f7fbff;
        background: #315d82;
      }

      .web-tab-cell {
        background: #111923 !important;
        color: #8e9baa !important;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          filter 140ms ease;
      }

      .web-tab-hovered {
        background: #1c2a36 !important;
        color: #e6edf3 !important;
        filter: brightness(1.08);
      }

      .web-tab-selected {
        background: #315d82 !important;
        color: #fff !important;
        font-weight: 700;
      }

      .web-tab-selected.web-tab-hovered {
        background: #3c709b !important;
      }

      .web-tab-start {
        border-radius: 999px 0 0 999px;
      }

      .web-tab-end {
        border-radius: 0 999px 999px 0;
      }

      .web-code-action {
        color: #fff !important;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        font-weight: 700;
        transition:
          background-color 120ms ease,
          filter 120ms ease;
      }

      .web-code-run {
        background: #315d82 !important;
      }

      .web-code-copy {
        background: #253442 !important;
      }

      .web-code-run:hover,
      .web-code-copy:hover {
        background: #3c709b !important;
        filter: brightness(1.08);
      }

      .web-code-start {
        border-radius: 999px 0 0 999px;
      }

      .web-code-end {
        border-radius: 0 999px 999px 0;
      }

      .web-clickable {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          filter 120ms ease;
      }

      .web-article-link:hover {
        background: #1c2a36 !important;
        color: #e6edf3 !important;
        filter: brightness(1.08);
      }

      .web-output-close:hover {
        background: #3c709b !important;
        color: #fff !important;
      }

      .web-back-link,
      .web-resume-link {
        color: #8fc7f2 !important;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .web-back-link:hover,
      .web-resume-link:hover {
        color: #d8eeff !important;
        background: #1c2a36 !important;
      }

      #mobile-controls {
        display: none;
      }

      @media (max-width: 480px) {
        #terminal > pre,
        #terminal_ratzilla_grid > pre {
          font-size: clamp(10px, 3vw, 13px);
          line-height: 1.1;
        }
      }

      @media (max-width: 700px), (pointer: coarse) {
        #terminal {
          bottom: calc(64px + env(safe-area-inset-bottom, 0px));
          touch-action: none;
        }

        body[data-mobile-article-open="true"] #terminal {
          bottom: calc(120px + env(safe-area-inset-bottom, 0px));
        }

        #mobile-controls {
          position: fixed;
          z-index: 30;
          right: max(8px, env(safe-area-inset-right));
          bottom: max(8px, env(safe-area-inset-bottom));
          left: max(8px, env(safe-area-inset-left));
          display: grid;
          gap: 8px;
          pointer-events: auto;
        }

        .mobile-article-actions,
        .mobile-tab-actions {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
        }

        .mobile-article-actions {
          display: none;
        }

        body[data-mobile-article-open="true"] .mobile-article-actions {
          display: grid;
        }

        #mobile-controls button,
        #mobile-controls a {
          min-width: 0;
          min-height: 48px;
          border: 1px solid #526170;
          border-radius: 14px;
          color: #e6edf3;
          background: rgb(17 25 35 / 94%);
          font: 700 13px/1 "SFMono-Regular", Consolas, "Liberation Mono",
            monospace;
          box-shadow: 0 8px 26px rgb(0 0 0 / 35%);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 8px;
          text-align: center;
          text-decoration: none;
          white-space: nowrap;
          overflow: hidden;
          cursor: pointer;
          touch-action: manipulation;
          user-select: none;
          -webkit-user-select: none;
        }

        #mobile-controls a[aria-current="page"] {
          border-color: #6da8d3;
          color: #fff;
          background: #315d82;
        }

        #mobile-controls button:active,
        #mobile-controls a:active {
          background: #315d82;
          transform: translateY(1px);
        }
      }

      .semantic-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body data-mobile-article-open="false">
    <div id="terminal"></div>
    <div id="article-media-layer" aria-live="polite"></div>
    <div id="mobile-controls">
      <div class="mobile-article-actions" aria-label="Article controls">
        <button type="button" data-article-action="back">← Articles</button>
        <button type="button" data-article-action="up" aria-label="Scroll article up">K ↑</button>
        <button type="button" data-article-action="down" aria-label="Scroll article down">J ↓</button>
      </div>
      <nav class="mobile-tab-actions" aria-label="Primary mobile navigation">
        <a href="/" data-mobile-tab="main">Main</a>
        <a href="/articles" data-mobile-tab="articles">Articles</a>
        <a href="/info" data-mobile-tab="info">Info</a>
      </nav>
    </div>
    <main class="semantic-fallback">
      <h1>svetsec.ru</h1>
      <nav aria-label="Primary">
        <a href="/">Main</a>
        <a href="/articles">Articles</a>
        <a href="/info">Info</a>
      </nav>
      <p>A personal site about security, Rust, and systems.</p>
    </main>
    <noscript>This site needs WebAssembly and JavaScript to display its interactive TUI.</noscript>
    <script>
      (() => {
        const terminal = document.getElementById("terminal");
        if (!terminal) return;

        let pending = false;
        const syncTerminalViewport = () => {
          if (pending) return;
          pending = true;
          requestAnimationFrame(() => {
            pending = false;
            window.dispatchEvent(new Event("resize"));
          });
        };

        // RatZilla measures its cell grid once. Re-run that measurement after
        // the initial layout/font pass and whenever the visual viewport really
        // changes (fullscreen, browser chrome, orientation, split view).
        if ("ResizeObserver" in window) {
          window.__svetsecResizeObserver = new ResizeObserver(syncTerminalViewport);
          window.__svetsecResizeObserver.observe(terminal);
        }

        // The WASM module can finish after the initial timers. Wait for its
        // grid to appear, then force one measurement against the final layout.
        if ("MutationObserver" in window) {
          const gridObserver = new MutationObserver(() => {
            if (!terminal.querySelector("#terminal_ratzilla_grid")) return;
            gridObserver.disconnect();
            syncTerminalViewport();
          });
          gridObserver.observe(terminal, { childList: true });
        }

        window.visualViewport?.addEventListener("resize", syncTerminalViewport);
        window.addEventListener("pageshow", syncTerminalViewport);
        document.addEventListener("fullscreenchange", syncTerminalViewport);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) syncTerminalViewport();
        });
        document.fonts?.ready.then(syncTerminalViewport);
        setTimeout(syncTerminalViewport, 0);
        setTimeout(syncTerminalViewport, 250);
        setTimeout(syncTerminalViewport, 1_000);
      })();
    </script>
  </body>
</html>
