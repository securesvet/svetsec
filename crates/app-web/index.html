<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="svetsec.ru — a personal site about security, Rust, and systems."
    />
    <meta name="theme-color" content="#ffffff" />
    <link data-trunk rel="rust" data-no-minify />
    <link
      data-trunk
      rel="copy-file"
      href="assets/profile.jpg"
      data-target-path="assets"
    />
    <title>svetsec.ru</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      #terminal {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      #article-media-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
      }

      .native-article-image {
        position: fixed;
        object-fit: contain;
        object-position: left top;
        background: #fff;
        image-rendering: auto;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      pre {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        /* RatZilla's viewport uses 10×20 px cells. Keeping the measured glyph
           below that bound prevents its render buffer from outgrowing the DOM
           grid on wide/fullscreen displays. */
        font: clamp(12px, 1vw, 16px) / 1.15 "SFMono-Regular", Consolas,
          "Liberation Mono", monospace;
        outline: none;
        color: #181a1c;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .web-tab-cell {
        background: #f5f6f4 !important;
        color: #696d70 !important;
        cursor: pointer;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          filter 140ms ease;
      }

      .web-tab-hovered {
        background: #e8e9e7 !important;
        color: #181a1c !important;
        filter: brightness(0.98);
      }

      .web-tab-selected {
        background: #181a1c !important;
        color: #fff !important;
        font-weight: 700;
      }

      .web-tab-selected.web-tab-hovered {
        background: #464a4e !important;
      }

      .web-tab-start {
        border-radius: 999px 0 0 999px;
      }

      .web-tab-end {
        border-radius: 0 999px 999px 0;
      }

      .web-code-action {
        color: #fff !important;
        cursor: pointer;
        font-weight: 700;
        transition:
          background-color 120ms ease,
          filter 120ms ease;
      }

      .web-code-run {
        background: #181a1c !important;
      }

      .web-code-copy {
        background: #464a4e !important;
      }

      .web-code-run:hover,
      .web-code-copy:hover {
        background: #6650a4 !important;
        filter: brightness(1.08);
      }

      .web-code-start {
        border-radius: 999px 0 0 999px;
      }

      .web-code-end {
        border-radius: 0 999px 999px 0;
      }

      .web-clickable {
        cursor: pointer;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          filter 120ms ease;
      }

      .web-article-link:hover {
        background: #e8e9e7 !important;
        color: #181a1c !important;
        filter: brightness(0.98);
      }

      .web-output-close:hover {
        background: #6650a4 !important;
        color: #fff !important;
      }

      @media (max-width: 480px) {
        pre {
          font-size: clamp(10px, 3vw, 13px);
          line-height: 1.1;
        }
      }

      .semantic-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="article-media-layer" aria-live="polite"></div>
    <main class="semantic-fallback">
      <h1>svetsec.ru</h1>
      <nav aria-label="Primary">
        <a href="/">Main</a>
        <a href="/articles">Articles</a>
        <a href="/info">Info</a>
      </nav>
      <p>A personal site about security, Rust, and systems.</p>
    </main>
    <noscript>This site needs WebAssembly and JavaScript to display its interactive TUI.</noscript>
  </body>
</html>
