[package]
name = "svetsec-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "svetsec-web"
path = "src/main.rs"

[dependencies]
critical-section.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
ratzilla.workspace = true
serde_json.workspace = true
svetsec-core = { path = "../app-core" }
svetsec-ui = { path = "../app-ui" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "Document",
    "DomRect",
    "CssStyleDeclaration",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "PointerEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Selection",
    "Storage",
    "Window",
] }
