name: svetsec

services:
  app:
    image: "${SVETSEC_IMAGE:?SVETSEC_IMAGE is required}"
    restart: unless-stopped
    init: true
    read_only: true
    env_file: ./shared/.env
    environment:
      SVETSEC_HTTP_ADDR: 0.0.0.0:3000
      SVETSEC_SSH_ADDR: 0.0.0.0:2222
      SVETSEC_STATIC_DIR: /app/dist
      SVETSEC_DATABASE: /data/svetsec.db
      SVETSEC_ARTICLES_DIR: /app/articles
      SVETSEC_OWNER_PUBLIC_KEY_FILE: /run/svetsec/owner_ed25519.pub
      SVETSEC_SSH_HOST_KEY_FILE: /run/svetsec/ssh_host_ed25519_key
    volumes:
      - ./shared:/run/svetsec:ro
      - ./data:/data
    ports:
      - "127.0.0.1:${SVETSEC_HTTP_PORT:-3000}:3000"
      - "${SVETSEC_SSH_PORT:-2222}:2222"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
